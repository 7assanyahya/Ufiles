<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Files</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="themeToggleBtn">🌙</button>
    </div>
    <button class="back-button" onclick="history.back()">&#x2190;</button>
    <div class="card">
        <h1>Server Files</h1>
        <ul id="server-files"></ul>
    </div>

    <script>
        function fetchFiles() {
            fetch('/server-files')
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('server-files');
                    list.innerHTML = '';
                    if (data && data.length > 0) {
                        data.forEach(file => {
                            const listItem = document.createElement('li');
                            const info = document.createElement('div');
                            info.className = 'file-info';
                            const name = document.createElement('span');
                            name.className = 'file-name';
                            name.textContent = file.name;
                            info.appendChild(name);

                            const group = document.createElement('div');
                            group.className = 'button-group';
                            const downloadBtn = document.createElement('button');
                            downloadBtn.className = 'download-btn';
                            downloadBtn.textContent = 'Download';
                            downloadBtn.addEventListener('click', () => downloadFile(file.name));
                            const deleteBtn = document.createElement('button');
                            deleteBtn.className = 'delete-btn';
                            deleteBtn.textContent = 'Delete';
                            deleteBtn.addEventListener('click', () => deleteFile(file.name));
                            group.append(downloadBtn, deleteBtn);

                            listItem.append(info, group);
                            list.appendChild(listItem);
                        });
                    } else {
                        list.innerHTML = '<li>No files found on server.</li>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching files:', error);
                    const list = document.getElementById('server-files');
                    list.innerHTML = '<li>Error loading files.</li>';
                });
        }

        function deleteFile(fileName) {
            if (!confirm(`Are you sure you want to delete ${fileName}?`)) {
                return;
            }
            fetch(`/delete?file=${encodeURIComponent(fileName)}`, { method: 'DELETE'})
                .then(response => {
                    if (response.ok) {
                        fetchFiles();
                    } else {
                        response.text().then(text => alert('Failed to delete file: ' + text));
                    }
                })
                .catch(error => {
                    console.error('Error deleting file:', error);
                    alert('Failed to delete file.');
                });
        }

        function downloadFile(fileName) {
            fetch(`/download?file=${encodeURIComponent(fileName)}`)
                .then(response => {
                    if (response.ok) {
                        return response.blob().then(blob => ({ blob, response }));
                    } else {
                        return response.text().then(text => { throw new Error(text); });
                    }
                })
                .then(({ blob, response }) => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    
                    // Try to get filename from Content-Disposition header
                    const disposition = response.headers.get('Content-Disposition');
                    let downloadName = fileName;
                    if (disposition && disposition.indexOf('attachment') !== -1) {
                        const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                        const matches = filenameRegex.exec(disposition);
                        if (matches != null && matches[1]) {
                            downloadName = matches[1].replace(/['"]/g, '');
                        }
                    }
                    a.download = downloadName;
                    
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();
                })
                .catch(error => {
                    console.error('Error downloading file:', error);
                    alert('Failed to download file: ' + error.message);
                });
        }

        window.onload = fetchFiles;
        setInterval(fetchFiles, 5000); // Auto-update every 5 seconds

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.textContent = '☀️';
            } else {
                themeToggleBtn.textContent = '🌙';
            }
        });

        // Set initial theme based on user preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️';
        }
    </script>
</body>
</html>
