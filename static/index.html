<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ufiles</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="card">
        <h1>Upload a File</h1>
        <form id="uploadForm" enctype="multipart/form-data" action="/upload" method="post">
            <div class="file-input-wrapper">
                <input type="file" name="file" id="fileInput" required/>
                <label for="fileInput" class="file-input-label">Choose a file</label>
            </div>
            <input type="submit" value="Upload"/>
        </form>
        <div id="loading" class="loading">Uploading...</div>
    </div>

    <div class="card2">
        <h2>Recent Uploads</h2>
        <ul id="last-uploaded-files"></ul>
    </div>

    <div class="card1">
        <a href="./file.html" class="but">
            <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
            <span>Server Files</span>
        </a>
    </div>
    <div class="theme-toggle">
        <button id="themeToggleBtn">🌙</button>
    </div>
    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.textContent = '☀️';
            } else {
                themeToggleBtn.textContent = '🌙';
            }
        });

        // Set initial theme based on user preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️';
        }
    </script>
</body>
</html>
