<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="card">
        <h1>Upload a File</h1>
        <form id="uploadForm" enctype="multipart/form-data" action="/upload" method="post">
            <div class="file-input-wrapper">
                <input type="file" name="file" id="fileInput"/>
                <label for="fileInput" class="file-input-label">Choose a file</label>
            </div>
            <input type="submit" value="Upload" />
        </form>
        <div id="loading" class="loading">Uploading...</div>
    </div>

    <div class="card2">
        <h2>Recent Uploads</h2>
        <ul id="last-uploaded-files"></ul>
    </div>

    <div class="card1">
        <a href="./file.html" class="but">
            <img src="https://img.icons8.com/ios/452/hdd.png" alt="server" width="24" height="24">
            <span>Server Files</span>
        </a>
    </div>
</body>
</html>
